{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Water Bottle Inventory{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --brand-maroon: #6e0c0c; 
        --brand-dark-maroon: #4d0909; 
        --header-height: 55px;
        --dark-gray: #333333;
      }

      .bg-maroon {
        background-color: var(--brand-maroon) !important;
      }
      
      body {
        min-height: 100vh;
        overflow-x: hidden;
        padding: 0;
        margin: 0;
      }
      
      .header {
        background-color: var(--brand-maroon);
        color: white;
        height: var(--header-height);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1030;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
      }
      
      .header h1 {
        font-size: 1.5rem;
        margin: 0;
      }
      
      /* Sidebar styling */
      .page-container {
        display: flex;
        padding-top: var(--header-height);
        min-height: calc(100vh - var(--header-height));
      }
      
      .sidebar {
        width: 220px;
        background-color: white;
        border-right: 1px solid #e5e5e5;
        padding-top: 20px;
        flex-shrink: 0;
      }
      
      .sidebar .nav-link {
        color: var(--brand-maroon);
        font-weight: 500;
        padding: 0.5rem 1rem;
        text-decoration: none;
        display: block;
      }
      
      .sidebar .nav-link:hover {
        background-color: rgba(110, 12, 12, 0.05);
      }
      
      /* Content area */
      .main-content {
        flex-grow: 1;
        padding: 20px;
        background-color: #f8f9fa;
      }
      
      /* Table styling */
      .table {
        background-color: white;
        border-collapse: collapse;
      }
      
      .table thead th {
        background-color: #212529;
        color: white;
        border: none;
      }
      
      .table tbody tr:nth-of-type(odd) {
        background-color: rgba(0, 0, 0, 0.03);
      }
      
      /* Button styling */
      .btn-details {
        background-color: #333;
        color: white;
        border: none;
        padding: 4px 12px;
      }
      
      .btn-details:hover {
        background-color: #555;
        color: white;
      }
      
      /* Footer */
      .footer {
        background-color: var(--brand-maroon);
        color: white;
        padding: 0.5rem 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <h1>My Water Bottles</h1>

    </header>

    <div class="page-container">
      <div class="sidebar">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'view_bottles' %}">
              View Bottles
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'view_suppliers' %}">
              View Suppliers
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'add_bottle' %}">
              Add Bottle
            </a>
          </li>
        </ul>
      </div>

      <div class="main-content">
        {% block content %}{% endblock %}
      </div>
    </div>

    <footer class="footer">
      <div class="container">
        <small>&copy; {% now "Y" %}</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
