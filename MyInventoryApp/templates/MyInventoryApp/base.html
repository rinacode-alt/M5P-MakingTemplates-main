{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Water Bottle Inventory{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --brand-maroon: #8b0000;
        --brand-dark-maroon: #660000;
      }

      .bg-maroon {
        background-color: var(--brand-maroon) !important;
      }

      .navbar {
        background-color: var(--brand-maroon) !important;
      }

      .footer {
        background-color: var(--brand-maroon);
        color: white;
        padding: 0.5rem 0;
        position: fixed;
        bottom: 0;
        width: 100%;
      }

      .navbar-brand,
      .nav-link {
        color: white !important;
      }

      .nav-link:hover {
        color: rgba(255, 255, 255, 0.8) !important;
      }

      main {
        margin-bottom: 60px;
        padding-top: 20px;
      }

      .table-header {
        background-color: var(--brand-maroon);
        color: white;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-maroon">
      <div class="container">
        <span class="navbar-brand"
          >My Water Bottles</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'view_bottles' %}">Bottles</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'view_suppliers' %}"
                >Suppliers</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'add_bottle' %}">Add Bottle</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container mt-4">{% block content %}{% endblock %}</main>

    <footer class="footer text-center">
      <div class="container">
        <small>&copy; {% now "Y" %} Water Bottle Inventory System</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
