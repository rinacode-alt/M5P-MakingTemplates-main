{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Water Bottle Inventory{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --brand-maroon: #6e0c0c; 
        --brand-dark-maroon: #4d0909; 
        --header-height: 55px;
        --dark-gray: #333333;
      }

      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow-x: hidden;
        padding: 0;
        margin: 0;
      }
      .content-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .container-fluid {
        flex: 1;
      }
      .row {
        flex: 1;
      }
      .bg-custom {
        background-color: #590404 !important;
      }
      .sidebar {
        position: sticky;
        top: 56px;
        height: calc(100vh - 112px); /* Navbar and footer height */
        overflow-y: auto;
        width: 220px;
        background-color: white;
        border-right: 1px solid #e5e5e5;
        padding-top: 20px;
        flex-shrink: 0;
      }
      .sidebar .nav-link {
        color: var(--brand-maroon);
        font-weight: 500;
        padding: 0.5rem 1rem;
        text-decoration: none;
        display: block;
      }
      .sidebar .nav-link:hover {
        background-color: rgba(110, 12, 12, 0.05);
      }
      .footer {
        padding: 1rem 0;
        color: white;
        text-align: center;
        background-color: var(--brand-maroon);
      }
      .table {
        background-color: white;
        border-collapse: collapse;
      }
      .table thead th {
        background-color: #212529;
        color: white;
        border: none;
      }
      .table tbody tr:nth-of-type(odd) {
        background-color: rgba(0, 0, 0, 0.03);
      }
      .btn-details {
        background-color: #333;
        color: white;
        border: none;
        padding: 4px 12px;
      }
      .btn-details:hover {
        background-color: #555;
        color: white;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-custom mb-3 sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand mb-0" href="{% url 'view_bottles' %}">My Water Bottles</a>
        <a href="{% url 'add_bottle' %}" class="text-white"><i class="material-icons">add</i></a>
      </div>
    </nav>

    <div class="content-wrapper">
      <div class="container-fluid">
        <div class="row">
          <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
            <div class="position-sticky">
              <ul class="nav flex-column">
                {% block sidebar %}
                <li class="nav-item">
                  <a class="nav-link {% if request.path == '/view_bottles/' %}active{% endif %}" href="{% url 'view_bottles' %}">
                    View Bottles
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link {% if request.path == '/view_suppliers/' %}active{% endif %}" href="{% url 'view_suppliers' %}">
                    View Suppliers
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link {% if request.path == '/add_bottle/' %}active{% endif %}" href="{% url 'add_bottle' %}">
                    Add Bottle
                  </a>
                </li>
                {% endblock %}
              </ul>
            </div>
          </nav>

          <main class="col-md-9 ms-sm-auto col-lg-10 px-4">
            {% block content %}{% endblock %}
          </main>
        </div>
      </div>
    </div>

    <footer class="footer bg-custom">
      <div class="container">
        <small>&copy; {% now "Y" %}</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
